# experiments.yaml - 数据选择实验配置文件

general:
  # 数据集配置
  data_path: "mydatasets"
  dataset: "adult"
  balance_target: true
  
  # 模型配置
  model_name: "MLP"
  task_type: "classification"
  device: "auto"  # auto, cpu, cuda
  
  # 训练参数
  epochs: 20
  batch_size: 128
  patience: 8
  selection_lr: 0.001
  selection_momentum: 0.9
  selection_weight_decay: 0.0005

# 实验列表 - 多方法多比例对比
experiments:

  # CG Influence方法 - 不同选择比例
  - name: "arnoldi_01percent"
    method: "arnoldi"
    selection_fraction: 0.01
    recursion_depth: 10
    damping: 0.01
    scale: 25.0
    num_test_samples: 1
    pretrain_epochs: 3

  - name: "arnoldi_05percent"
    method: "arnoldi"
    selection_fraction: 0.05
    recursion_depth: 15
    damping: 0.01
    scale: 25.0
    num_test_samples: 1
    pretrain_epochs: 3

  - name: "arnoldi_10percent"
    method: "arnoldi"
    selection_fraction: 0.1
    recursion_depth: 20
    damping: 0.01
    scale: 25.0
    num_test_samples: 1
    pretrain_epochs: 3

  - name: "arnoldi_20percent"
    method: "arnoldi"
    selection_fraction: 0.2
    recursion_depth: 25
    damping: 0.01
    scale: 25.0
    num_test_samples: 1
    pretrain_epochs: 3

  - name: "arnoldi_30percent"
    method: "arnoldi"
    selection_fraction: 0.3
    recursion_depth: 30
    damping: 0.01
    scale: 25.0
    num_test_samples: 1
    pretrain_epochs: 3

  - name: "arnoldi_50percent"
    method: "arnoldi"
    selection_fraction: 0.5
    recursion_depth: 40
    damping: 0.01
    scale: 25.0
    num_test_samples: 1
    pretrain_epochs: 3

  - name: "arnoldi_70percent"
    method: "arnoldi"
    selection_fraction: 0.7
    recursion_depth: 50
    damping: 0.01
    scale: 25.0
    num_test_samples: 1
    pretrain_epochs: 3

  - name: "arnoldi_90percent"
    method: "arnoldi"
    selection_fraction: 0.9
    recursion_depth: 60
    damping: 0.01
    scale: 25.0
    num_test_samples: 1
    pretrain_epochs: 3

